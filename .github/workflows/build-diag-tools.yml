name: Build UF896 DIAG Tools

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "Docs/Modem Stability/uf896-diag-tools/**.c"
      - "Docs/Modem Stability/uf896-diag-tools/**.h"
      - ".github/workflows/build-diag-tools.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download musl aarch64 cross-compiler
        run: |
          # musl.cc times out from GitHub-hosted runners (rate-limits/blocks
          # CI IP ranges); Bootlin's toolchain server is CI-friendly.
          curl -fsSL --retry 3 --max-time 120 \
            https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2026.08-1.tar.xz \
            -o /tmp/toolchain.tar.xz
          tar -xJf /tmp/toolchain.tar.xz -C /tmp
          echo "/tmp/aarch64--musl--stable-2026.08-1/bin" >> "$GITHUB_PATH"

      - name: Build all diag tools
        run: |
          cd "Docs/Modem Stability/uf896-diag-tools"
          GCC=aarch64-buildroot-linux-musl-gcc
          mkdir -p ../../../artifacts/uf896-diag-tools
          for src in *.c; do
            bin="${src%.c}"
            echo "==> Building $bin"
            "$GCC" -static -Wall -O2 -I include -o "../../../artifacts/uf896-diag-tools/$bin" "$src"
          done

      - name: Upload built tools
        uses: actions/upload-artifact@v4
        with:
          name: uf896-diag-tools-${{ github.sha }}
          path: artifacts/uf896-diag-tools/
